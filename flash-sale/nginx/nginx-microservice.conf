worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format main '$remote_addr - [$time_local] "$request" $status '
    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # In HW6 the API surface is fronted by the Go gateway. Nginx only handles
    # static assets and forwards /api/* and /health to the gateway, which in
    # turn does service discovery via Nacos and applies sentinel rules.
    upstream go_gateway {
        server gateway:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://go_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /health {
            proxy_pass http://go_gateway/health;
        }

        location = /gateway/instances {
            proxy_pass http://go_gateway;
        }
    }
}
