services:
  # === Databases ===
  order-db:
    image: postgres:16-alpine
    container_name: flash-sale-order-db
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: order_db
    ports:
      - "5441:5432"
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db-replica:
    image: postgres:16-alpine
    container_name: flash-sale-order-db-replica
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: order_db
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:16-alpine
    container_name: flash-sale-inventory-db
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: inventory_db
    ports:
      - "5442:5432"
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: flash-sale-payment-db
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: payment_db
    ports:
      - "5443:5432"
    volumes:
      - payment-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Infrastructure ===
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: flash-sale-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: flash-sale-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: flash-sale-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # === Microservices ===
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    container_name: flash-sale-order-service
    ports:
      - "8081:8081"
    environment:
      FLASH_SALE_SERVER_PORT: 8081
      FLASH_SALE_SNOWFLAKE_NODE_ID: 1
      FLASH_SALE_NACOS_ENABLED: "true"
      FLASH_SALE_NACOS_HOST: nacos
      FLASH_SALE_NACOS_PORT: 8848
      FLASH_SALE_NACOS_SERVICE_NAME: order-service
    volumes:
      - ./config/order-service.yaml:/app/config/config.yaml:ro
    depends_on:
      order-db:
        condition: service_healthy
      order-db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    container_name: flash-sale-inventory-service
    ports:
      - "8082:8082"
    environment:
      FLASH_SALE_SERVER_PORT: 8082
      FLASH_SALE_NACOS_ENABLED: "true"
      FLASH_SALE_NACOS_HOST: nacos
      FLASH_SALE_NACOS_PORT: 8848
      FLASH_SALE_NACOS_SERVICE_NAME: inventory-service
    volumes:
      - ./config/inventory-service.yaml:/app/config/config.yaml:ro
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: flash-sale-payment-service
    ports:
      - "8083:8083"
    environment:
      FLASH_SALE_SERVER_PORT: 8083
      FLASH_SALE_PAYMENT_SUCCESS_RATE: "1.0"
      FLASH_SALE_NACOS_ENABLED: "true"
      FLASH_SALE_NACOS_HOST: nacos
      FLASH_SALE_NACOS_PORT: 8848
      FLASH_SALE_NACOS_SERVICE_NAME: payment-service
    volumes:
      - ./config/payment-service.yaml:/app/config/config.yaml:ro
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: flash-sale-gateway
    ports:
      - "8000:8000"
    environment:
      FLASH_SALE_SERVER_PORT: 8000
      FLASH_SALE_NACOS_ENABLED: "true"
      FLASH_SALE_NACOS_HOST: nacos
      FLASH_SALE_NACOS_PORT: 8848
    volumes:
      - ./config/gateway.yaml:/app/config/config.yaml:ro
    depends_on:
      nacos:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started

  # === Edge / Static ===
  nginx:
    image: nginx:latest
    container_name: flash-sale-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-microservice.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - gateway

volumes:
  order-pgdata:
  inventory-pgdata:
  payment-pgdata:
