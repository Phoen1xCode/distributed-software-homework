services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale123
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: flash-sale-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: flash-sale-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  app-1:
    build: .
    container_name: flash-sale-app-1
    ports:
      - "8081:8081"
    environment:
      FLASH_SALE_SERVER_PORT: 8081
      FLASH_SALE_DATABASE_HOST: postgres
      FLASH_SALE_DATABASE_PORT: 5432
      FLASH_SALE_DATABASE_USER: flashsale
      FLASH_SALE_DATABASE_PASSWORD: flashsale123
      FLASH_SALE_DATABASE_DBNAME: flashsale
      FLASH_SALE_DATABASE_SSLMODE: disable
      FLASH_SALE_REDIS_HOST: redis
      FLASH_SALE_REDIS_PORT: 6379
      FLASH_SALE_KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  app-2:
    build: .
    container_name: flash-sale-app-2
    ports:
      - "8082:8082"
    environment:
      FLASH_SALE_SERVER_PORT: 8082
      FLASH_SALE_DATABASE_HOST: postgres
      FLASH_SALE_DATABASE_PORT: 5432
      FLASH_SALE_DATABASE_USER: flashsale
      FLASH_SALE_DATABASE_PASSWORD: flashsale123
      FLASH_SALE_DATABASE_DBNAME: flashsale
      FLASH_SALE_DATABASE_SSLMODE: disable
      FLASH_SALE_REDIS_HOST: redis
      FLASH_SALE_REDIS_PORT: 6379
      FLASH_SALE_KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: flash-sale-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - app-1
      - app-2

volumes:
  pgdata:
